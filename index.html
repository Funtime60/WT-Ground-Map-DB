<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>War Thunder map fingerprinting tool</title>
		<meta name="description" content="This uses the fact that while the WebUI for the game doesn't allow CORS, the endpoints it uses do. It collects data from 3 enpoints that refer to the map and stores them as JSON with a few extra details like team and a hash.">
 		<link rel="stylesheet" href="style.css">
		<script type="module">
			import { collectData, filePath } from "./collectData.js";
			let data = {};

			function updateCollectionInfo() {
				const countSpan = document.querySelector('h2#collectionCount > span');
				const listUl = document.querySelector('ul#collectionList');
				const keys = Object.keys(data);
				countSpan.textContent = keys.length;
				[...listUl.elements].forEach((element) => element.remove());
				keys.forEach(key => listUl.appendChild(Object.assign(document.createElement("li"), {textContent: data[key].mapName || key})));
			}

			document.addEventListener("DOMContentLoaded", (event) => {
				const form = document.querySelector("form#mainForm");
				form.addEventListener("submit", (e) => postAllData(form));
				updateCollectionInfo();
			});

			function postAllData(form) {
				const currentMapName = form.current_map_name.value;
				const mapType = form.map_type.value;
				const typeIteration = form.type_iteration.value;
				const battleRating = form.battle_rating.value;
				const mapName = `[${mapType}${typeIteration > 0 ? ` #${typeIteration}`: ''}] ${currentMapName}`;

				console.log("Current Map Name:", currentMapName);
				console.log("Map Type:", mapType);
				console.log("Type Iteration:", typeIteration);
				console.log("Battle Rating:", battleRating);
				console.log("Map Name:", mapName);
				
				[...form.elements].forEach((element) => element.disabled = true);
				if(form.submitted === 'Collect') {
					collectData(data, mapName, battleRating).then((new_data) => {
						data = new_data;
						updateCollectionInfo();
						[...form.elements].forEach((element) => element.disabled = false);
					});
				}else {
					let a = Object.assign(document.createElement('a'), {href: URL.createObjectURL(new Blob([JSON.stringify(data)], {type: "application/json"})), download: filePath, textContent: "Downloading json data..."});
					form.appendChild(a);
					a.click();
					form.removeChild(a);
					data = {};
					updateCollectionInfo();
					[...form.elements].forEach((element) => element.disabled = false);
				}
				
			};
		</script>
	</head>
	<body>
		<form id="mainForm" action="javascript:;">
			<div>
				<label for="current_map_name">Current Map Name</label>
				<input type="text" id="current_map_name" name="current_map_name" required>
			</div>
			<div>
				<label for="map_type">Map Type</label>
				<select id="map_type" name="map_type" required list="typeNumbers">
					<option value="Battle"    >Battle</option>
					<option value="Conquest"  >Conquest</option>
					<option value="Domination">Domination</option>
				</select>
				<datalist id="typeNumbers">
					<option value="1"></option>
					<option value="2"></option>
					<option value="3"></option>
				</datalist>
			</div>
			<div>
				<label for="type_iteration">Type Iteration</label>
				<input type="number" id="type_iteration" name="type_iteration" min="0">
			</div>
			<div>
				<label for="battle_rating">Battle Rating</label>
				<input type="text" id="battle_rating" name="battle_rating" min="1.0" list="battleRatings" required>
				<datalist id="battleRatings">
					<option value="1.0"></option>
					<option value="1.3"></option>
					<option value="1.7"></option>
					<option value="2.0"></option>
					<option value="2.3"></option>
					<option value="2.7"></option>
					<option value="3.0"></option>
					<option value="3.3"></option>
					<option value="3.7"></option>
					<option value="4.0"></option>
					<option value="4.3"></option>
					<option value="4.7"></option>
					<option value="5.0"></option>
					<option value="5.3"></option>
					<option value="5.7"></option>
					<option value="6.0"></option>
					<option value="6.3"></option>
					<option value="6.7"></option>
					<option value="7.0"></option>
					<option value="7.3"></option>
					<option value="7.7"></option>
					<option value="8.0"></option>
					<option value="8.3"></option>
					<option value="8.7"></option>
					<option value="9.0"></option>
					<option value="9.3"></option>
					<option value="9.7"></option>
					<option value="10.0"></option>
					<option value="10.3"></option>
					<option value="10.7"></option>
					<option value="11.0"></option>
					<option value="11.3"></option>
					<option value="11.7"></option>
					<option value="12.0"></option>
					<option value="12.3"></option>
					<option value="12.7"></option>
					<option value="13.0"></option>
					<option value="13.3"></option>
					<option value="13.7"></option>
				</datalist>
			</div>
			<button type="submit" onclick="this.form.submitted='Collect';" >Collect Fingerprint</button>
			<div id="collectionInfo">
				<h2 id="collectionCount">Collection Count: <span>0</span></h2>
				<hr>
				<ul id="collectionList">
					<!-- Collection items will be dynamically added here -->
				</ul>
			</div>
			<button type="submit" onclick="this.form.submitted='Download';">Download Collection</button>
		</form>
	</body>
</html>
