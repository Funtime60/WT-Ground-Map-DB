<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>War Thunder map fingerprinting tool</title>
		<meta name="description" content="This uses the fact that while the WebUI for the game doesn't allow CORS, the endpoints it uses do. It collects data from 3 endpoints that refer to the map and stores them as JSON with a few extra details like team and a hash.">
		<!-- NOTE: The STAR team of a custom battle is the one used to take the preview maps so it will be the blue side. -->
 		<link rel="stylesheet" href="style.css">
		<script type="module">
			import { collectData, filePath } from "./collectData.js";
			let data = {};

			function updateCollectionInfo() {
				updateCollectionCount();
				updateCollectionList();
				setFormDisable(false);
			}
			function updateCollectionCount() {
				const countSpan = document.querySelector('h2#collectionCount > span');
				countSpan.textContent = Object.keys(data).length;
			}
			function updateCollectionList() {
				const listUl = document.querySelector('ul#collectionList');
				[...listUl.children].forEach((element) => element.remove());
				Object.keys(data).forEach(key => {
					const li = Object.assign(document.createElement("li"), {textContent: data[key].full_ID || key});
					listUl.appendChild(li);
					li.addEventListener("contextmenu", (e) => {
						e.preventDefault();
						if(confirm(`Are you sure you want to delete the entry "${li.textContent}"?`)) {
							delete data[key];
							updateCollectionCount();
							li.remove();
						}
					});
					li.addEventListener("wheel", (e)=>{
						e.preventDefault();
						li.scrollLeft += Math.sign(e.deltaY) * (li.clientWidth/20);
					});
				});
			}

			function setFormDisable(state) {
				[...document.querySelector("form#mainForm").elements].forEach((element) => element.disabled = state);
			}
			function setFormRequirements(state) {
				[...document.querySelectorAll(`form [${state ? "temp_optional" : "required"}]`)].forEach((e) => {e.removeAttribute(`${state ? "temp_optional" : "required"}`);e.setAttribute(`${!state ? "temp_optional" : "required"}`, "")})
			}

			document.addEventListener("DOMContentLoaded", (event) => {
				const form = document.querySelector("form#mainForm");
				form.addEventListener("submit", (e) => postAllData(form));
				const upload = document.querySelector("form > button#upload");
				upload.addEventListener("mouseenter", (e) => setFormRequirements(false));
				upload.addEventListener("focus"     , (e) => setFormRequirements(false));
				upload.addEventListener("mouseleave", (e) => setFormRequirements(true));
				upload.addEventListener("blur"      , (e) => setFormRequirements(true));
				updateCollectionInfo();
			});

			function postAllData(form) {

				setFormDisable(true);
				switch(form.submitted) {
					case 'Collect':
						const currentMapName = form.current_map_name.value;
						const mapType = form.map_type.value;
						const typeIteration = form.type_iteration.value;
						const battleRating = form.battle_rating.value;
						const mapName = `[${mapType}${typeIteration > 0 ? ` #${typeIteration}`: ''}] ${currentMapName}`;
						
						console.log("Collecting Data");

						console.log("Current Map Name:", currentMapName);
						console.log("Map Type:", mapType);
						console.log("Type Iteration:", typeIteration);
						console.log("Battle Rating:", battleRating);
						console.log("Map Name:", mapName);

						collectData(data, mapName, battleRating).then((new_data) => {
							data = new_data;
							updateCollectionInfo();
						});
						break;
					case 'Download':
						const a = Object.assign(document.createElement('a'), {href: URL.createObjectURL(new Blob([JSON.stringify(data)], {type: "application/json"})), download: filePath, textContent: "Downloading json data..."});
						form.appendChild(a);
						a.click();
						form.removeChild(a);
						data = {};
						updateCollectionInfo();
						break;
					case 'Upload':
						const file = Object.assign(document.createElement('input'), {type: "file", accept: ".json", textContent: "Downloading json data..."});
						file.addEventListener("change", (e) => {
							if(!file.files.length) return;
							const reader = new FileReader();
							reader.addEventListener("load", (e) => {
								data = JSON.parse(reader.result);
								updateCollectionInfo();
							});
							reader.readAsText(file.files[0]);
						});
						form.appendChild(file);
						file.click();
						form.removeChild(file);
						break;
					default:
						console.log("Unknown submission!");
						break;
				}				
			};
		</script>
	</head>
	<body>
		<form id="mainForm" action="javascript:;">
			<button type="submit" id="upload" onclick="this.form.submitted='Upload';">Upload Collection</button>
			<div>
				<label for="current_map_name">Current Map Name</label>
				<input type="text" id="current_map_name" name="current_map_name" required>
			</div>
			<div>
				<label for="map_type">Map Type</label>
				<select id="map_type" name="map_type" required list="typeNumbers">
					<option value="Battle"    >Battle</option>
					<option value="Conquest"  >Conquest</option>
					<option value="Domination">Domination</option>
				</select>
				<datalist id="typeNumbers">
					<option value="1"></option>
					<option value="2"></option>
					<option value="3"></option>
				</datalist>
			</div>
			<div>
				<label for="type_iteration">Type Iteration</label>
				<input type="number" id="type_iteration" name="type_iteration" min="0">
			</div>
			<div>
				<label for="battle_rating">Battle Rating</label>
				<input type="text" id="battle_rating" name="battle_rating" min="1.0" list="battleRatings" required>
				<datalist id="battleRatings">
					<option value="1.0"></option>
					<option value="1.3"></option>
					<option value="1.7"></option>
					<option value="2.0"></option>
					<option value="2.3"></option>
					<option value="2.7"></option>
					<option value="3.0"></option>
					<option value="3.3"></option>
					<option value="3.7"></option>
					<option value="4.0"></option>
					<option value="4.3"></option>
					<option value="4.7"></option>
					<option value="5.0"></option>
					<option value="5.3"></option>
					<option value="5.7"></option>
					<option value="6.0"></option>
					<option value="6.3"></option>
					<option value="6.7"></option>
					<option value="7.0"></option>
					<option value="7.3"></option>
					<option value="7.7"></option>
					<option value="8.0"></option>
					<option value="8.3"></option>
					<option value="8.7"></option>
					<option value="9.0"></option>
					<option value="9.3"></option>
					<option value="9.7"></option>
					<option value="10.0"></option>
					<option value="10.3"></option>
					<option value="10.7"></option>
					<option value="11.0"></option>
					<option value="11.3"></option>
					<option value="11.7"></option>
					<option value="12.0"></option>
					<option value="12.3"></option>
					<option value="12.7"></option>
					<option value="13.0"></option>
					<option value="13.3"></option>
					<option value="13.7"></option>
					<option value="14.0"></option>
				</datalist>
			</div>
			<button type="submit" id="collect" onclick="this.form.submitted='Collect';">Collect Fingerprint</button>
			<div id="collectionInfo">
				<h2 id="collectionCount">Collection Count: <span>0</span></h2>
				<hr>
				<ul id="collectionList">
					<!-- Collection items will be dynamically added here -->
				</ul>
			</div>
			<button type="submit" id="download" onclick="this.form.submitted='Download';">Download Collection</button>
		</form>
	</body>
</html>
