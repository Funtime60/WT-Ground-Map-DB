<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta http-equiv="X-UA-Compatible" content="ie=edge">
		<title>HTML 5 Boilerplate</title>
		<link rel="stylesheet" href="style.css">
		<script type="module">
			//import { Octokit, App } from "https://esm.sh/octokit";
			import { collectData, filePath } from "./collectData.js";
			
			document.addEventListener("DOMContentLoaded", (event) => {
				const form = document.querySelector("form#mainForm");
				form.addEventListener("submit", (e) => {
					postAllData(form);
				});
			});
			async function dummy_collectData(data, mapName) {
				return {mapName: {}};
			}
			function postAllData(form) {
				const currentMapName = form.current_map_name.value;
				const mapType = form.map_type.value;
				const typeIteration = form.type_iteration.value;
				const mapName = `[${mapType}${typeIteration > 0 ? ` #${typeIteration}`: ''}] ${currentMapName}`;

				console.log("Current Map Name:", currentMapName);
				console.log("Map Type:", mapType);
				console.log("Type Iteration:", typeIteration);
				console.log("Map Name:", mapName);

				dummy_collectData({}, mapName).then((data) => {
					let a = Object.assign(document.createElement('a'), {href: URL.createObjectURL(new Blob([JSON.stringify(data)], {type: "application/json"})), download: filePath, textContent: "Downloading json data..."});
					form.appendChild(a);
					a.click();
					form.removeChild(a);
				});
			};
		</script>
	</head>
	<body>
		<form id="mainForm" action="javascript:;">
			<div>
				<label for="current_map_name">Current Map Name</label>
				<input type="text" id="current_map_name" name="current_map_name" required>
			</div>
			<div>
				<label for="map_type">Map Type</label>
				<select id="map_type" name="map_type" required>
					<option value="Battle"    >Battle</option>
					<option value="Conquest"  >Conquest</option>
					<option value="Domination">Domination</option>
				</select>
			</div>
			<div>
				<label for="type_iteration">Type Iteration</label>
				<input type="number" id="type_iteration" name="type_iteration" min="0">
			</div>
			<button type="submit">Submit</button>
		</form>
	</body>
</html>
