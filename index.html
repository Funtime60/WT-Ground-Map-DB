<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta http-equiv="X-UA-Compatible" content="ie=edge">
		<title>HTML 5 Boilerplate</title>
		<link rel="stylesheet" href="style.css">
		<script type="module">
			import { Octokit, App } from "https://esm.sh/octokit";
			import { collectData, filePath } from "./collectData.js";
			/*/
			//*/
			document.addEventListener("DOMContentLoaded", (event) => {
				const form = document.querySelector("form#mainForm");
				form.addEventListener("submit", (e) => {
					postAllData(form);
				});
			});
			async function dummy_collectData(data) {
				return {};
			}
			function postAllData(form) {
				const currentMapName = form.current_map_name.value;
				const mapType = form.map_type.value;
				const typeIteration = form.type_iteration.value;

				console.log("Current Map Name:", currentMapName);
				console.log("Map Type:", mapType);
				console.log("Type Iteration:", typeIteration);

				dummy_collectData({}).then((data) => {
					alert(`[${mapType}${typeIteration > 0 ? ` #${typeIteration}`: ''}] ${currentMapName}`);
				});
			};
		</script>
	</head>
	<body>
		<form id="mainForm" action="javascript:;">
			<div>
				<label for="current_map_name">Current Map Name</label>
				<input type="text" id="current_map_name" name="current_map_name" required>
			</div>
			<div>
				<label for="map_type">Map Type</label>
				<select id="map_type" name="map_type" required>
					<option value="option1">Battle</option>
					<option value="option2">Conquest</option>
					<option value="option3">Domination</option>
				</select>
			</div>
			<div>
				<label for="type_iteration">Type Iteration</label>
				<input type="number" id="type_iteration" name="type_iteration" min="0">
			</div>
			<button type="submit">Submit</button>
		</form>
	</body>
</html>
